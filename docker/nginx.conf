server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin proxy to the engine, so the browser never sees a second
    # host and there is no CORS preflight on every triage action.
    location /api/ {
        proxy_pass http://api:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Book replay reconstructs the session from the tape; a long window
        # on a large tape can take a few seconds.
        proxy_read_timeout 60s;
    }

    # The bundle is content-hashed by Vite, so it can be cached hard.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
